# Generated by CH57x Keyboard Web Configurator
# Key comments (the tool ignores them): "#@ L<layer> R<row> C<column>: text" for a button,
# "#@ L<layer> K<knob> ccw|press|cw: text" for a knob.
#@ L1 R2 C1: IntelliJ split
#@ L1 R2 C2: IntelliJ zen
#@ L1 R2 C3: IntelliJ hide tools
#@ L1 R3 C1: vscode side bar toggle
#@ L1 R3 C2: vscode markdown view
#@ L1 R3 C3: vscode markdown view side-by-side
#@ L1 R4 C1: vscode split
#@ L1 R4 C2: vscode zen
#@ L1 R4 C3: vscode toggle output
#@ L1 K1 ccw: decrease zoom (Edge browser & vscode))
#@ L1 K1 press: default zoom (Edge browser & vscode)
#@ L1 K1 cw: increase zoom (Edge browser & vscode))
#@ L1 K4 ccw: volume down
#@ L1 K4 press: mute
#@ L1 K4 cw: volume up
#@ L2 R4 C1: vs 2022 split
#@ L2 R4 C2: vs 2022 full-screen
#@ L2 R4 C3: vs 2022 close output
#@ L2 K1 ccw: decrease zoom (Edge browser & vscode)
#@ L2 K1 press: default zoom (Edge browser & vscode)
#@ L2 K1 cw: increase zoom (Edge browser & vscode)
#@ L2 K4 ccw: volume down
#@ L2 K4 press: mute
#@ L2 K4 cw: volume up
#@ L3 K1 ccw: decrease zoom (Edge browser & vscode))
#@ L3 K1 press: default zoom (Edge browser & vscode)
#@ L3 K1 cw: increase zoom (Edge browser & vscode))
#@ L3 K4 ccw: volume down
#@ L3 K4 press: mute
#@ L3 K4 cw: volume up
model: ch57x-2
orientation: normal
rows: 4
columns: 3
knobs: 4
layers:
  - buttons:
      - ["f", "click", "shift-n"]
      - ["shift-f4", "ctrl-grave,4,2", "alt-4"]
      - ["ctrl-b", "ctrl-shift-v", "ctrl-k,v"]
      - ["ctrl-k,o", "ctrl-k,z", "ctrl-shift-u"]
    knobs:
      - ccw: "ctrl-minus"
        press: "ctrl-numpad0"
        cw: "ctrl-numpadplus"
      - ccw: "left"
        press: "play"
        cw: "right"
      - ccw: "down"
        press: "m"
        cw: "up"
      - ccw: "volumedown"
        press: "mute"
        cw: "volumeup"

  - buttons:
      - ["f", "click", "shift-n"]
      - ["<000>", "<000>", "<000>"]
      - ["<000>", "<000>", "<000>"]
      - ["alt-w,f", "shift-alt-enter", "ctrl-alt-o,alt-w,c"]
    knobs:
      - ccw: "ctrl-minus"
        press: "ctrl-numpad0"
        cw: "ctrl-numpadplus"
      - ccw: "left"
        press: "play"
        cw: "right"
      - ccw: "down"
        press: "m"
        cw: "up"
      - ccw: "volumedown"
        press: "mute"
        cw: "volumeup"

  - buttons:
      - ["f", "click", "shift-n"]
      - ["<000>", "<000>", "<000>"]
      - ["<000>", "<000>", "<000>"]
      - ["<000>", "<000>", "<000>"]
    knobs:
      - ccw: "ctrl-minus"
        press: "ctrl-numpad0"
        cw: "ctrl-numpadplus"
      - ccw: "left"
        press: "play"
        cw: "right"
      - ccw: "down"
        press: "m"
        cw: "up"
      - ccw: "volumedown"
        press: "mute"
        cw: "volumeup"
