# Natural keyboard orienation is when buttons are on the left
# side and knobs are on the right. However you may want to use
# keyboard in another orienation. To avoid remapping button
# positions in your head, just given it here.
# Possible values are:
#   (horizontal)
#   - 'normal': button on the left, knobs on the right
#   - 'upsidedown': button on the right, knobs on the left
#   (vertical)
#   - 'clockwise': button on the top, knobs on the bottom
#   - 'counterclockwise': button on the bottom, knobs on the top
orientation: normal

# There are different models of keyboard with different number
# buttons and knobs. Write it here for proper handling.
# Count rows and columns when keyboard is in normal orienation,
# with knobs on the right side.
rows: 4
columns: 3
knobs: 4

layers:
  - buttons:
      - ["f", "click", "shift-n"]
      - ["shift-f4", "ctrl-grave,4,2", "alt-4"]                 # IntelliJ split; IntelliJ zen; IntelliJ hide tools
      - ["ctrl-b", "ctrl-shift-v","ctrl-k,v"]                   # vscode side bar toggle; vscode markdown view; vscode markdown view side-by-side
      - ["ctrl-k,o", "ctrl-k,z", "ctrl-shift-u"]                # vscode split; vscode zen; vscode toggle output
    knobs:
      - ccw: 'ctrl-minus'                                       # decrease zoom (Edge browser & vscode))
        press: 'ctrl-numpad0'                                   # default zoom (Edge browser & vscode)
        cw: 'ctrl-numpadplus'                                   # increase zoom (Edge browser & vscode))
      - ccw: 'left'
        press: 'play'
        cw: 'right'
      - ccw: 'down'
        press: 'm'
        cw: 'up'
      - ccw: 'volumedown'                                       # volume down
        press: 'mute'                                           # mute
        cw: 'volumeup'                                          # volume up

  - buttons:
      - ["f", "click", "shift-n"]
      - ["<000>", "<000>", "<000>"]
      - ["<000>", "<000>", "<000>"]
      - ["alt-w,f", "shift-alt-enter", "ctrl-alt-o,alt-w,c"]    # vs 2022 split; vs 2022 full-screen; vs 2022 close output
    knobs:
      - ccw: 'ctrl-minus'                                       # decrease zoom (Edge browser & vscode)
        press: 'ctrl-numpad0'                                   # default zoom (Edge browser & vscode)
        cw: 'ctrl-numpadplus'                                   # increase zoom (Edge browser & vscode)
      - ccw: 'left'
        press: 'play'
        cw: 'right'
      - ccw: 'down'
        press: 'm'
        cw: 'up'
      - ccw: 'volumedown'                                       # volume down
        press: 'mute'                                           # mute
        cw: 'volumeup'                                          # volume up

  - buttons:
      - ["f", "click", "shift-n"]
      - ["<000>", "<000>", "<000>"]
      - ["<000>", "<000>", "<000>"]
      - ["<000>", "<000>", "<000>"]
    knobs:
      - ccw: 'ctrl-minus'                                       # decrease zoom (Edge browser & vscode))
        press: 'ctrl-numpad0'                                   # default zoom (Edge browser & vscode)
        cw: 'ctrl-numpadplus'                                   # increase zoom (Edge browser & vscode))
      - ccw: 'left'
        press: 'play'
        cw: 'right'
      - ccw: 'down'
        press: 'm'
        cw: 'up'
      - ccw: 'volumedown'                                       # volume down
        press: 'mute'                                           # mute
        cw: 'volumeup'                                          # volume up